<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweetie — Advanced Interface</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500&family=Geist+Mono&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;background:#F5F3E8;color:#1A1A1A;font-family:"Figtree",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:64px 24px}
.cap{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.06em;color:#6B7180;text-transform:uppercase}
h1{font-weight:400;font-size:52px;letter-spacing:-.04em;margin:12px 0 8px;color:#00473D}
p{color:#595959;margin:0 0 40px;letter-spacing:-.01em}
.glow{height:140px;border-radius:28px;margin:0 0 40px;background:radial-gradient(ellipse 60% 90% at 50% 50%,#41834F 0%,#95CC62 49%,#C0E396 70%,#F5F3E8 100%)}
ol{list-style:none;padding:0;margin:0;border-top:1px solid #DDD6CB}
li{border-bottom:1px solid #DDD6CB}
a,span.row{display:flex;justify-content:space-between;padding:18px 4px;color:#1A1A1A;text-decoration:none;font-size:17px;letter-spacing:-.02em}
a:hover{color:#00473D}
span.row{color:#B3B3B3}
small{font-family:"Geist Mono",monospace;font-size:12px;color:#6B7180}
a small{color:#00473D}
</style>
</head>
<body>
<main>
  <div class="cap">Advanced Interface · ArtCenter</div>
  <h1>Sweetie</h1>
  <p>Sweetgreen LLM — start with one word. A design system of interactive components for an AI-powered ordering experience, built one component per week.</p>
  <div class="glow" aria-hidden="true"></div>
  <ol>
    <li><a href="wk01-loaders/">Week 1 · Loaders <small>live</small></a></li>
